<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BBH+Bogle&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="pokedex">
    <h1 class="bbh-bogle-regular">POKEDEX</h1>

    <form id="pokemon-form">
      <label for="pokemon-name">Nome do Pokémon:</label>
      <input id="pokemon-name" type="text" placeholder="Ex.: pikachu" required>
      <button type="submit" class="bbh-bogle-regular">Buscar Pokémon</button>
    </form>

    <section id="results" class="results" aria-live="polite">
      <p>Digite o nome de um Pokémon para começar.</p>
    </section>
  </main>
</body>
</html>
